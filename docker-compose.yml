services:
  db:
    image: mysql:8.4
    container_name: vuejs-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: minilab
      MYSQL_USER: cova
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata: